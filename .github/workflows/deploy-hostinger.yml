# Builds the static site on every push to main and publishes it to the `hostinger` branch.
# Hostinger (hPanel → Advanced → Git) deploys that branch into public_html via its webhook.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build static site
        run: bun run build:static

      - name: Check the export
        run: |
          test -f static/index.html
          test -f static/.htaccess
          test -f static/sitemap.xml
          test -f static/404.html
          test "$(find static -name index.html | wc -l)" -ge 14

      - name: Publish to the hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./static
          force_orphan: true
          enable_jekyll: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy ${{ github.sha }}"
